<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .sub { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .start { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.8; rx: 10; }
      .state { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; rx: 10; }
      .decision { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.8; }
      .skill { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.8; rx: 10; }
      .move { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.8; rx: 10; }
      .fail { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.8; rx: 10; }
      .text { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .small { font: 12px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="1600" height="1120"/>
  <text class="title" x="60" y="55">自动战斗详细流程</text>
  <text class="sub" x="60" y="84">BattleManager: 开关启动 -> FixedUpdate 思考 -> 索敌 -> 移动到技能范围 -> 复用技能施法入口</text>

  <rect class="start" x="70" y="130" width="240" height="78"/>
  <text class="text" x="92" y="162">AutoBattleBtn</text>
  <text class="small" x="92" y="184">OnClick / OnEnable 缓存恢复</text>

  <rect class="state" x="380" y="130" width="250" height="78"/>
  <text class="text" x="402" y="162">SwitchAutoBattle()</text>
  <text class="small" x="402" y="184">禁止则 return；否则 Start/Stop</text>

  <polygon class="decision" points="780,128 920,169 780,210 640,169"/>
  <text class="text" x="725" y="164">IsForbid?</text>
  <text class="small" x="734" y="184">是否禁止</text>

  <rect class="fail" x="1010" y="130" width="220" height="78"/>
  <text class="text" x="1032" y="162">return</text>
  <text class="small" x="1032" y="184">不进入自动战斗</text>

  <polygon class="decision" points="505,260 645,301 505,342 365,301"/>
  <text class="text" x="450" y="296">IsAutoBattling?</text>
  <text class="small" x="470" y="316">当前是否开启</text>

  <rect class="state" x="710" y="260" width="250" height="82"/>
  <text class="text" x="732" y="293">Start()</text>
  <text class="small" x="732" y="315">UpdateBateState(Open)</text>

  <rect class="fail" x="70" y="260" width="220" height="82"/>
  <text class="text" x="92" y="293">Stop()</text>
  <text class="small" x="92" y="315">移除监听并关闭状态</text>

  <rect class="state" x="1030" y="260" width="300" height="100"/>
  <text class="text" x="1052" y="292">启动准备</text>
  <text class="small" x="1052" y="315">OnEventListener()</text>
  <text class="small" x="1052" y="337">AddFixedUpdateListener(OnFixedUpdate)</text>

  <rect class="state" x="1030" y="405" width="300" height="106"/>
  <text class="text" x="1052" y="437">打断旧行为并刷新缓存</text>
  <text class="small" x="1052" y="460">RecordAutoBattleStartPos(true)</text>
  <text class="small" x="1052" y="482">BreakFindPath / BreakFollow</text>
  <text class="small" x="1052" y="504">RefreshCacheSkillPosContainers()</text>

  <rect class="state" x="710" y="430" width="250" height="78"/>
  <text class="text" x="732" y="462">MarkDirtyState(true)</text>
  <text class="small" x="732" y="484">触发下一次思考</text>

  <rect class="state" x="380" y="430" width="250" height="96"/>
  <text class="text" x="402" y="462">OnFixedUpdate()</text>
  <text class="small" x="402" y="484">扣 globalSkillCD / coolTime</text>
  <text class="small" x="402" y="506">检查 dirty 和 thinkingTimes</text>

  <polygon class="decision" points="505,585 665,630 505,675 345,630"/>
  <text class="text" x="430" y="624">IsExecuteAutoBattle?</text>
  <text class="small" x="432" y="646">主角存在/未死/未挂起/未寻路</text>

  <rect class="fail" x="70" y="590" width="220" height="78"/>
  <text class="text" x="92" y="622">等待下一帧</text>
  <text class="small" x="92" y="644">条件不满足不执行</text>

  <rect class="state" x="720" y="590" width="250" height="78"/>
  <text class="text" x="742" y="622">OnTick()</text>
  <text class="small" x="742" y="644">非 HoldOn 时进入索敌</text>

  <rect class="state" x="1030" y="590" width="250" height="78"/>
  <text class="text" x="1052" y="622">SearchEnemyFight()</text>
  <text class="small" x="1052" y="644">SearchEnemy()</text>

  <polygon class="decision" points="1185,735 1325,776 1185,817 1045,776"/>
  <text class="text" x="1135" y="771">找到目标?</text>
  <text class="small" x="1128" y="791">curAutoBattleAtkEntity</text>

  <rect class="move" x="1345" y="735" width="210" height="82"/>
  <text class="text" x="1367" y="768">GotoTargetPos()</text>
  <text class="small" x="1367" y="790">找不到怪则回目标点/起点</text>

  <rect class="skill" x="720" y="735" width="260" height="82"/>
  <text class="text" x="742" y="768">GotoFightEnemy()</text>
  <text class="small" x="742" y="790">取可用技能槽 + 目标距离</text>

  <polygon class="decision" points="850,880 1010,925 850,970 690,925"/>
  <text class="text" x="780" y="920">目标在技能范围?</text>
  <text class="small" x="782" y="942">CheckIsSkillArea()</text>

  <rect class="skill" x="1090" y="875" width="250" height="94"/>
  <text class="text" x="1112" y="908">AutoBattleUseSkill()</text>
  <text class="small" x="1112" y="930">TryUseSkill() -> UseSkill()</text>
  <text class="small" x="1112" y="952">MarkAutoBattleCD()</text>

  <rect class="move" x="380" y="875" width="250" height="94"/>
  <text class="text" x="402" y="908">移动到释放点</text>
  <text class="small" x="402" y="930">FindDistanceValidPoint()</text>
  <text class="small" x="402" y="952">TryFindPath(... AutoBattle)</text>

  <rect class="skill" x="1090" y="1010" width="250" height="64"/>
  <text class="text" x="1112" y="1040">StartGlobalSkillCD()</text>
  <text class="small" x="1112" y="1060">成功后等待下一轮</text>

  <path class="arrow" d="M310 169 L380 169"/>
  <path class="arrow" d="M630 169 L640 169"/>
  <path class="arrow" d="M920 169 L1010 169"/>
  <path class="arrow" d="M505 208 L505 260"/>
  <path class="arrow" d="M365 301 L290 301"/>
  <path class="arrow" d="M645 301 L710 301"/>
  <path class="arrow" d="M960 301 L1030 301"/>
  <path class="arrow" d="M1180 360 L1180 405"/>
  <path class="arrow" d="M1030 469 L960 469"/>
  <path class="arrow" d="M710 469 L630 478"/>
  <path class="arrow" d="M505 526 L505 585"/>
  <path class="arrow" d="M345 630 L290 630"/>
  <path class="arrow" d="M665 630 L720 630"/>
  <path class="arrow" d="M970 630 L1030 630"/>
  <path class="arrow" d="M1155 668 L1185 735"/>
  <path class="arrow" d="M1325 776 L1345 776"/>
  <path class="arrow" d="M1045 776 L980 776"/>
  <path class="arrow" d="M850 817 L850 880"/>
  <path class="arrow" d="M1010 925 L1090 925"/>
  <path class="arrow" d="M690 925 L630 925"/>
  <path class="arrow" d="M1215 969 L1215 1010"/>
  <path class="dash" d="M505 969 C505 1060 170 1060 170 668"/>
  <path class="dash" d="M1215 1074 C1215 1100 170 1100 170 668"/>
</svg>

