<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 449.80150000000003 380" width="449.80150000000003" height="380" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#3d59a1;--accent:#7aa2f7;--muted:#565f89;--surface:#24283b;--border:#414868;background:var(--bg);--_line:#3d59a1;--_arrow:#3d59a1;--_text:#a9b1d6;--_text-sec:#565f89;--_text-muted:#565f89;--_node-fill:#1a1b26;--_node-stroke:#565f89;--_group-fill:#7aa2f718;--_group-hdr:#7aa2f7;--_inner-stroke:#565f89" id="bm-diagram-1">
<style>
#bm-diagram-1 {
  /* 覆盖 CSS 变量 */
  --_text:       #a9b1d6       !important;
  --_text-sec:   #565f89 !important;
  --_line:       #3d59a1      !important;
  --_arrow:      #3d59a1      !important;
  --_node-fill:  #1a1b26       !important;
  --_node-stroke:#565f89    !important;
  --_group-fill: #7aa2f718 !important;
  --_group-hdr:  #7aa2f7 !important;
}
#bm-diagram-1 text {
  font-family: 'SF Pro Text', sans-serif !important;
  font-size:   13px !important;
  dominant-baseline: central;
  dy: 0.35em;
}
/* 直接覆盖元素属性 */
#bm-diagram-1 rect[fill="var(--_node-fill)"],
#bm-diagram-1 circle[fill="var(--_node-fill)"],
#bm-diagram-1 ellipse[fill="var(--_node-fill)"],
#bm-diagram-1 polygon[fill="var(--_node-fill)"] {
  fill:         #1a1b26        !important;
  stroke:       #565f89     !important;
  stroke-width: 1px !important;
  rx:           12px !important;
  ry:           12px !important;
  filter: drop-shadow(0 8px 16px rgba(255,255,255,0.1)) !important;
}
/* 节点文字 */
#bm-diagram-1 g.node text {
  fill: #a9b1d6 !important;
}
/* 子图/cluster 标题 */
#bm-diagram-1 .cluster-label text {
  fill:        #7aa2f7 !important;
  font-size:   12px !important;
  font-weight: 600 !important;
}
/* 边/连线 */
#bm-diagram-1 .edge, #bm-diagram-1 .edgePath .path {
  stroke:       #3d59a1  !important;
  stroke-width: 1.5px !important;
}
#bm-diagram-1 path {
  stroke:       #3d59a1  !important;
  stroke-width: 1.5px !important;
}
/* 箭头 */
#bm-diagram-1 .arrowhead polygon,
#bm-diagram-1 marker polygon {
  stroke: #3d59a1 !important;
  fill:   #3d59a1 !important;
}
/* 边标签 */
#bm-diagram-1 .edgeLabel text {
  fill:      #565f89 !important;
  font-size: 11px  !important;
}</style>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="UI" x1="86.24799999999999" y1="70" x2="86.24799999999999" y2="350" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Mgr" x1="227.99949999999998" y1="70" x2="227.99949999999998" y2="350" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Passive" x1="367.9995" y1="70" x2="367.9995" y2="350" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="UI" data-to="Mgr" data-label="SetAutoBattle(true)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="86.24799999999999" y1="90" x2="227.99949999999998" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="157.12374999999997" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">SetAutoBattle(true)</text>
</g>
<g class="message" data-from="Mgr" data-to="Mgr" data-label="启用自动选敌/释放" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="227.99949999999998,130 257.9995,130 257.9995,150 227.99949999999998,150" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="265.9995" y="140" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">启用自动选敌/释放</text>
</g>
<g class="message" data-from="Mgr" data-to="Passive" data-label="触发被动决策" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="227.99949999999998" y1="200" x2="367.9995" y2="200" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="297.9995" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">触发被动决策</text>
</g>
<g class="message" data-from="UI" data-to="Mgr" data-label="SetAutoBattle(false)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="86.24799999999999" y1="240" x2="227.99949999999998" y2="240" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="157.12374999999997" y="230" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">SetAutoBattle(false)</text>
</g>
<g class="message" data-from="Mgr" data-to="Mgr" data-label="切回手动" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="227.99949999999998,280 257.9995,280 257.9995,300 227.99949999999998,300" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="265.9995" y="290" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">切回手动</text>
</g>
<g class="actor" data-id="UI" data-label="AutoBattleBtn" data-type="participant">
  <rect x="30" y="30" width="112.49599999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="86.24799999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">AutoBattleBtn</text>
</g>
<g class="actor" data-id="Mgr" data-label="BattleMgr" data-type="participant">
  <rect x="182.49599999999998" y="30" width="91.007" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="227.99949999999998" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">BattleMgr</text>
</g>
<g class="actor" data-id="Passive" data-label="PassiveInfo" data-type="participant">
  <rect x="316.1975" y="30" width="103.604" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="367.9995" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">PassiveInfo</text>
</g>
</svg>