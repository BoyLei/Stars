  <line x1="364.29449999999997" y1="210" x2="217.7265" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="291.0105" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">注册 OnBuffTick</text>
</g>
