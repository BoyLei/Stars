  <line x1="217.7265" y1="170" x2="364.29449999999997" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="291.0105" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">EnterStage()</text>
</g>
