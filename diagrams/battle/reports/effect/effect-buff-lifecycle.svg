  <line x1="217.7265" y1="278" x2="364.29449999999997" y2="278" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="291.0105" y="268" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Tick()</text>
</g>
<g class="message" data-from="BH" data-to="BI" data-label="应用属性/效果" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="364.29449999999997" y1="318" x2="510.17549999999994" y2="318" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="437.23499999999996" y="308" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">应用属性/效果</text>
</g>
<g class="message" data-from="SB" data-to="SB" data-label="RemoveBuff()" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="217.7265,358 247.7265,358 247.7265,378 217.7265,378" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="255.7265" y="368" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">RemoveBuff()</text>
</g>
<g class="message" data-from="SB" data-to="BH" data-label="ExitStage()" data-line-style="solid" data-arrow-head="filled" data-self="false">
