  <line x1="217.7265" y1="130" x2="510.17549999999994" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="363.95099999999996" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Init(buffCfg)</text>
</g>
