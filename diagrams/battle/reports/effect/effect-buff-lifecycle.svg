</g>
<g class="actor" data-id="BI" data-label="BuffInfo" data-type="participant">
  <rect x="470.17549999999994" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="510.17549999999994" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">BuffInfo</text>
