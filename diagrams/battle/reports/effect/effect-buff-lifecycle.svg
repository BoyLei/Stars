</g>
<g class="actor" data-id="BH" data-label="BuffStageHandle" data-type="participant">
  <rect x="298.4135" y="30" width="131.762" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
