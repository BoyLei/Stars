</g>
<g class="message" data-from="BH" data-to="BL" data-label="OnHitTarget()" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="406.801" y1="318" x2="249.859" y2="318" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="328.33" y="308" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">OnHitTarget()</text>
</g>
<g class="message" data-from="BL" data-to="SK" data-label="回调命中效果(EffectUtils)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="249.859" y1="358" x2="96.9925" y2="358" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="173.42575" y="348" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">回调命中效果(EffectUtils)</text>
</g>
<g class="actor" data-id="SK" data-label="Skill层(Agent-4a)" data-type="participant">
