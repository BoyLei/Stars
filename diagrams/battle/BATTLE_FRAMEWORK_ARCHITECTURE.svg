<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4b5563; }
      .lane-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .box-title { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .box-text { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #374151; }
      .note { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4b5563; }
      .lane { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.4; rx: 12; }
      .service { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.6; rx: 10; }
      .runtime { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.6; rx: 10; }
      .skill { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.6; rx: 10; }
      .effect { fill: #fdf2f8; stroke: #ec4899; stroke-width: 1.6; rx: 10; }
      .support { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.6; rx: 10; }
      .arrow { stroke: #4b5563; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #6b7280; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
      .badge { fill: #111827; opacity: 0.08; rx: 7; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

